[env]
# CATATAN: OPENCV_BUILD dan OPENCV_CMAKE_ARGS di sini SEBELUMNYA gak
# ngefek sama sekali. opencv-rust gak pernah build OpenCV C++ dari source
# sendiri — dia cuma "discovery" (nyari OpenCV yang udah ke-install lewat
# pkg-config / vcpkg / cmake find_package). OPENCV_CMAKE_ARGS diteruskan ke
# skrip probe kecil buat NEMUIN OpenCV, bukan ke build system OpenCV itu
# sendiri, jadi semua -DBUILD_opencv_*=OFF / -DWITH_*=OFF gak pernah kepake.
#
# Solusinya: OpenCV di-build manual dari source sebagai step CI terpisah
# (lihat build.yml, step "Build OpenCV (minimal, static)"), pakai persis
# modul/flag yang tadinya ada di file ini. Habis itu opencv-rust tinggal
# diarahin ke hasil install-nya lewat OpenCV_DIR (env var resmi yang
# dipakai buat cmake find_package probe) — di-set langsung di build.yml
# karena pathnya baru ketahuan saat runtime CI (tergantung cache/prefix).
#
# File ini sekarang cuma nyimpen env var yang BENERAN dibaca opencv-rust:

# Pastikan OpenCV di-link statis pakai CRT dinamis (/MD), match sama default
# Rust di target *-pc-windows-msvc (crt-static OFF secara default) dan sama
# CRT yang dipakai Python itu sendiri.
OPENCV_MSVC_CRT = "dynamic"
